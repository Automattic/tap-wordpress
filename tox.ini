[tox]
envlist = py38,py39,py310,py311,py312
isolated_build = true

[testenv]
deps = 
    pytest
    pytest-cov
    black
    flake8
    mypy
    types-requests
commands =
    pytest --cov=tap_wordpress --cov-report=term-missing
    black --check tap_wordpress tests
    flake8 tap_wordpress tests
    mypy tap_wordpress

[testenv:format]
deps = black
commands = black tap_wordpress tests

[testenv:lint]
deps = 
    flake8
    mypy
    types-requests
commands = 
    flake8 tap_wordpress tests
    mypy tap_wordpress

[flake8]
max-line-length = 88
extend-ignore = E203, W503
exclude = .git,__pycache__,.tox,.eggs,*.egg,build,dist,.venv

[coverage:run]
branch = True
source = tap_wordpress

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError